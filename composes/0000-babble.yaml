# First rung: learn enough mixed prose to produce recognizable continuations.
kind: waldo-model-compose
schema: 1
architecture:
  family: decoder-transformer
  context_tokens: 512
  vocabulary_size: 259
  hidden_size: 384
  intermediate_size: 1024
  layers: 6
  attention_heads: 6
  key_value_heads: 2
  tie_embeddings: true
  parameter_dtype: bfloat16
  tokenizer:
    name: byte
    revision: builtin-byte-schema-1
stages:
  - name: pretrain
    type: pre-training
    objective: causal-language-modeling
    corpora:
      - core/books/gutenberg
      - core/common-pile/foodista
      - core/common-pile/public-domain-review
      - core/common-pile/python-enhancement-proposals/peps
    parameters:
      profile: causal-pretrain-v2
      steps: 31984
      batch_size: 64
      sequence_length: 512
      learning_rate: 0.0003
      seed: 42
      warmup_steps: 320
      checkpoint_every: 3198
      evaluate_every: 3198
