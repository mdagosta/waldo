# Fifth rung: learn basic user/assistant interaction after a clean language base.
kind: waldo-model-compose
schema: 1
architecture:
  family: decoder-transformer
  context_tokens: 2048
  vocabulary_size: 50259
  hidden_size: 768
  intermediate_size: 2048
  layers: 16
  attention_heads: 12
  key_value_heads: 4
  dropout: 0.1
  tie_embeddings: true
  parameter_dtype: bfloat16
  tokenizer:
    name: tiktoken/r50k_base
    revision: tiktoken-r50k-base
stages:
  - name: pretrain
    type: pre-training
    objective: causal-language-modeling
    filter:
      main_content: true
      exclude:
        repetitive_content: true
        boilerplate_content: true
    corpora:
      - path: core/books/gutenberg
        weight: 3
      - path: science/plos
        weight: 4
      - path: government/regulations
        weight: 1
    parameters:
      profile: causal-pretrain-weighted
      steps: 183105
      batch_size: 16
      sequence_length: 2048
      learning_rate: 0.00018
      seed: 42
      weight_decay: 0.12
      warmup_steps: 1831
      shuffle_buffer_records: 65536
      shuffle_buffer_bytes: 2147483648
      checkpoint_every: 18310
      evaluate_every: 18310
      evaluation_max_records: 1024
      evaluation_max_bytes: 33554432

  - name: instruction-tune
    type: fine-tuning
    objective: causal-language-modeling
    filter:
      main_content: true
      exclude:
        repetitive_content: true
        boilerplate_content: true
    corpora:
      - path: post-train/sft/dolly
        weight: 2
      - path: post-train/sft/oasst1
        weight: 3
      - path: post-train/sft/oasst2
        weight: 4
    parameters:
      profile: causal-pretrain-weighted
      epochs: 5
      steps: 1220
      batch_size: 16
      sequence_length: 2048
      learning_rate: 0.00003
      seed: 43
      weight_decay: 0.05
      warmup_steps: 61
      shuffle_buffer_records: 16384
      shuffle_buffer_bytes: 268435456
      checkpoint_every: 244
      evaluate_every: 244
      evaluation_max_records: 1024
      evaluation_max_bytes: 33554432
