# Build a generally useful conversational model with an explicit reasoning
# curriculum layered on the technology model's knowledge foundation.
kind: waldo-model-compose
schema: 1
interaction:
  template: user-assistant-v1
architecture:
  family: decoder-transformer
  context_tokens: 2048
  vocabulary_size: 50259
  hidden_size: 1152
  intermediate_size: 3072
  layers: 20
  attention_heads: 16
  key_value_heads: 4
  dropout: 0.1
  tie_embeddings: true
  parameter_dtype: bfloat16
  tokenizer:
    name: tiktoken/r50k_base
    revision: tiktoken-r50k-base
stages:
  - name: pretrain
    type: pre-training
    objective: causal-language-modeling
    filter: &quality
      main_content: true
      exclude:
        repetitive_content: true
        boilerplate_content: true
    corpora:
      - {path: core/synthetic/cosmopedia-v2, weight: 6}
      - {path: core/common-pile/wikimedia, weight: 3}
      - {path: core/common-pile/stackexchange, weight: 3}
      - {path: core/books/gutenberg, weight: 1}
      - {path: core/common-pile/pressbooks, weight: 1}
      - {path: science/plos, weight: 1}
      - {path: science/arxiv-abstracts, weight: 1}
      - {path: code/permissive, weight: 1}
      - {path: code/cloud-native-core, weight: 1}
    parameters:
      profile: causal-pretrain-weighted
      tokens: 19999997952
      batch_size: 16
      sequence_length: 2048
      learning_rate: 0.00013
      seed: 52
      weight_decay: 0.15
      warmup_steps: 6104
      shuffle_buffer_records: 65536
      shuffle_buffer_bytes: 2147483648
      checkpoint_every: 24414
      evaluate_every: 24414
      evaluation_max_records: 1024
      evaluation_max_bytes: 33554432

  - name: conversational-midtrain
    type: fine-tuning
    objective: assistant-response-modeling
    conversation: &assistant
      template: user-assistant-v1
      supervised_roles: [assistant]
    filter: *quality
    corpora:
      - {path: post-train/sft/smol-smoltalk, weight: 5}
      - path: post-train/sft/tulu3
        weight: 3
        filter:
          sources:
            exclude:
              - ai2-adapt-dev/no_robots_converted
              - ai2-adapt-dev/oasst1_converted
              - ai2-adapt-dev/tulu_v3.9_aya_100k
      - {path: post-train/sft/oasst2, weight: 2}
    parameters:
      profile: causal-pretrain-weighted
      epochs: 2
      batch_size: 8
      sequence_length: 2048
      learning_rate: 0.00004
      seed: 53
      weight_decay: 0.08
      warmup_steps: 305
      shuffle_buffer_records: 32768
      shuffle_buffer_bytes: 1073741824
      checkpoint_every: 3051
      evaluate_every: 3051
      evaluation_max_records: 1024
      evaluation_max_bytes: 33554432

  - name: reasoning-sft
    type: fine-tuning
    objective: assistant-response-modeling
    conversation: *assistant
    filter: *quality
    corpora:
      - {path: post-train/sft/openthoughts-114k, weight: 6}
      - {path: post-train/sft/smol-smoltalk, weight: 1}
    parameters:
      profile: causal-pretrain-weighted
      epochs: 3
      batch_size: 8
      sequence_length: 2048
      learning_rate: 0.00002
      seed: 54
      weight_decay: 0.05
      warmup_steps: 153
      shuffle_buffer_records: 32768
      shuffle_buffer_bytes: 1073741824
      checkpoint_every: 1526
      evaluate_every: 1526
      evaluation_max_records: 1024
      evaluation_max_bytes: 33554432

  - name: interaction-alignment
    type: fine-tuning
    objective: assistant-response-modeling
    conversation: *assistant
    filter: *quality
    corpora:
      - {path: post-train/sft/interaction-contract-v1, weight: 8}
      - {path: post-train/sft/helpsteer2, weight: 3}
    parameters:
      profile: causal-pretrain-weighted
      epochs: 2
      batch_size: 8
      sequence_length: 2048
      learning_rate: 0.00001
      seed: 55
      weight_decay: 0.04
      warmup_steps: 77
      shuffle_buffer_records: 16384
      shuffle_buffer_bytes: 268435456
      checkpoint_every: 508
      evaluate_every: 508
      evaluation_max_records: 1024
      evaluation_max_bytes: 33554432
