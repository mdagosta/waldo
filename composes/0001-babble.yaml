# Validated first language-model rung: produce coherent local continuations.
kind: waldo-model-compose
schema: 1
architecture:
  family: decoder-transformer
  context_tokens: 512
  vocabulary_size: 50259
  hidden_size: 512
  intermediate_size: 1536
  layers: 8
  attention_heads: 8
  key_value_heads: 2
  tie_embeddings: true
  parameter_dtype: bfloat16
  tokenizer:
    name: tiktoken/r50k_base
    revision: tiktoken-r50k-base
stages:
  - name: pretrain
    type: pre-training
    objective: causal-language-modeling
    corpora:
      - core/books/gutenberg
      - science/plos
    parameters:
      profile: causal-pretrain-balanced
      steps: 32000
      batch_size: 64
      sequence_length: 512
      learning_rate: 0.0003
      seed: 42
      warmup_steps: 320
      checkpoint_every: 3200
      evaluate_every: 3200
      evaluation_max_records: 512
      evaluation_max_bytes: 16777216
