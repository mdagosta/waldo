# Sixth rung: build a broad base, then teach explicit user/assistant exchanges.
kind: waldo-model-compose
schema: 1
architecture:
  family: decoder-transformer
  context_tokens: 2048
  vocabulary_size: 259
  hidden_size: 1024
  intermediate_size: 2816
  layers: 24
  attention_heads: 16
  key_value_heads: 4
  tie_embeddings: true
  parameter_dtype: bfloat16
  tokenizer:
    name: byte
    revision: builtin-byte-schema-1
stages:
  - name: pretrain
    type: pre-training
    objective: causal-language-modeling
    corpora:
      - core/books
      - core/common-pile/wikimedia
      - core/common-pile/stackexchange
      - government
      - science
    parameters:
      profile: causal-pretrain-v2
      steps: 495766
      batch_size: 32
      sequence_length: 2048
      learning_rate: 0.0003
      seed: 42
      warmup_steps: 4958
      checkpoint_every: 49577
      evaluate_every: 49577
  - name: dialogue
    type: fine-tuning
    objective: causal-language-modeling
    corpora:
      - post-train/sft
    parameters:
      profile: causal-pretrain-v2
      steps: 1800
      batch_size: 32
      sequence_length: 2048
      learning_rate: 0.00005
      seed: 43
      warmup_steps: 50
      checkpoint_every: 300
      evaluate_every: 300
