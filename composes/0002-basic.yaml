# Third rung: establish basic cross-domain language-model capability.
kind: waldo-model-compose
schema: 1
architecture:
  family: decoder-transformer
  context_tokens: 1024
  vocabulary_size: 50259
  hidden_size: 768
  intermediate_size: 2048
  layers: 12
  attention_heads: 12
  key_value_heads: 4
  tie_embeddings: true
  parameter_dtype: bfloat16
  tokenizer:
    name: tiktoken/r50k_base
    revision: tiktoken-r50k-base
stages:
  - name: pretrain
    type: pre-training
    objective: causal-language-modeling
    corpora:
      - core/books/gutenberg
      - core/common-pile/wikimedia
      - science/plos
    parameters:
      profile: causal-pretrain-v2
      steps: 60000
      batch_size: 64
      sequence_length: 1024
      learning_rate: 0.00025
      seed: 42
      warmup_steps: 600
      checkpoint_every: 6000
      evaluate_every: 6000
      evaluation_max_records: 512
      evaluation_max_bytes: 16777216
