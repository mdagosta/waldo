# Third rung: establish basic cross-domain language-model capability.
kind: waldo-model-compose
schema: 1
architecture:
  family: decoder-transformer
  context_tokens: 1024
  vocabulary_size: 50259
  hidden_size: 768
  intermediate_size: 2048
  layers: 12
  attention_heads: 12
  key_value_heads: 4
  dropout: 0.1
  tie_embeddings: true
  parameter_dtype: bfloat16
  tokenizer:
    name: tiktoken/r50k_base
    revision: tiktoken-r50k-base
stages:
  - name: pretrain
    type: pre-training
    objective: causal-language-modeling
    corpora:
      - path: core/books/gutenberg
        weight: 2
      - path: core/common-pile/wikimedia
        weight: 4
      - path: science/plos
        weight: 2
    parameters:
      profile: causal-pretrain-weighted
      steps: 60000
      batch_size: 64
      sequence_length: 1024
      learning_rate: 0.0002
      seed: 42
      weight_decay: 0.15
      warmup_steps: 600
      shuffle_buffer_records: 32768
      shuffle_buffer_bytes: 1073741824
      checkpoint_every: 6000
      evaluate_every: 6000
      evaluation_max_records: 512
      evaluation_max_bytes: 16777216
