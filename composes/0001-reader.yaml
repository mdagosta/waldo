# Second rung: sustain coherent sentences and short paragraph continuations.
kind: waldo-model-compose
schema: 1
architecture:
  family: decoder-transformer
  context_tokens: 2048
  vocabulary_size: 259
  hidden_size: 768
  intermediate_size: 2048
  layers: 12
  attention_heads: 12
  key_value_heads: 4
  tie_embeddings: true
  parameter_dtype: bfloat16
  tokenizer:
    name: byte
    revision: builtin-byte-schema-1
stages:
  - name: pretrain
    type: pre-training
    objective: causal-language-modeling
    corpora:
      - core/books
      - core/common-pile/foodista
      - core/common-pile/public-domain-review
      - core/common-pile/python-enhancement-proposals/peps
    parameters:
      profile: causal-pretrain-v1
      steps: 36947
      batch_size: 64
      sequence_length: 2048
      learning_rate: 0.0003
      seed: 42
      warmup_steps: 369
      checkpoint_every: 3695
      evaluate_every: 3695
