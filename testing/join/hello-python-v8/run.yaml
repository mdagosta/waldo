# hello-python-v8: python-byte-v6 trained only on Python and its docs and config, to a held-out
# loss, as a save point that post-training plans (python-byte-v7 and later) pin as their base.
kind: waldo-model-compose
schema: 1
interaction:
  template: user-assistant-v1
architecture:
  family: decoder-transformer
  context_tokens: 1024           # bytes; the longest post-training program is 373
  vocabulary_size: 259
  hidden_size: 512
  intermediate_size: 1536
  layers: 8
  attention_heads: 8
  key_value_heads: 4
  tie_embeddings: true
  parameter_dtype: bfloat16
  tokenizer:
    name: byte
    revision: builtin-byte-schema-1
stages:
  - name: pretrain
    type: pre-training
    objective: causal-language-modeling
    filter:
      main_content: true
      exclude:
        repetitive_content: true
        boilerplate_content: true
      # Python, its docs and config, at any depth; ~44% of v6's bytes were Python, ~80% here.
      # waldito data mix run.yaml --keep '*.py,*.pyi,*.pyx,*.md,*.rst,*.yaml,*.yml,*.toml,*.cfg,*.ini,requirements*.txt' --emit-filter
      metadata:
        source_path:
