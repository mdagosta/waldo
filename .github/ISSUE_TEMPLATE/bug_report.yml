name: Bug report
description: Report reproducible behavior that appears incorrect.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve WALDO while it is under active development.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include the command, actual result, and expected result.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest safe sequence that reproduces the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: WALDO version or commit
      placeholder: waldo --version or Git commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, architecture, Go version, and relevant optional runtime or accelerator.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Remove credentials, private paths, and sensitive corpus content before posting.
      render: shell
