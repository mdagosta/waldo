# OpenWALDO dev environment on orpheus. Start with `make dev-up` from the Mac host, in a checkout of the
# md/waldito branch; see .devcontainer/README.md. One service, no published ports, no credentials.
# Training stays on the Mac (Metal, ~/.waldo); this is for code and tests.
name: waldo

services:
  app:
    build:
      context: .
    # Comes back up when Colima starts, unless stopped on purpose (`make dev-down`).
    restart: unless-stopped
    hostname: waldo-dev
    init: true
    # NET_ADMIN lets the entrypoint (root, at start) put up the outbound firewall (firewall.sh). Only root
    # holds it, and no-new-privileges means nothing running as mdagosta can become root to take it down.
    cap_add:
      - NET_ADMIN
    environment:
      # Outbound policy (firewall.sh): open-https = any public HTTPS, never the Mac, LAN or Docker host;
      # allowlist = only the hosts in firewall-allowlist. Override: WALDO_FIREWALL_MODE=allowlist make dev-up
      WALDO_FIREWALL_MODE: ${WALDO_FIREWALL_MODE:-open-https}
    security_opt:
      - no-new-privileges:true
    volumes:
      # Every openwaldo repo, one folder each, as on the Mac (src/openwaldo/<repo>); worktrees go beside
      # them. Git push/fetch over `ssh waldo-dev` is the only bridge (`dev.sh push`).
      - repos:/home/mdagosta/src/openwaldo
      # Claude Code's login and settings; Go's module and build caches (so a rebuild doesn't refetch).
      - claude:/home/mdagosta/.claude
      - go:/home/mdagosta/go
      # The container's own ~/.waldo: a managed index checkout and scratch, never the Mac's (236 GB of
      # corpora and models, which training on the Mac needs).
      - waldo_home:/home/mdagosta/.waldo
      # Public half of orpheus's key, for SSH from herdr and git on the Mac (sshd/waldo.conf).
      - ${HOME}/.ssh/id_orpheus.pub:/run/host-ssh/authorized_key.pub:ro
      # The Mac's dotfiles repo. Read-only: a writable .bashrc would let anything in here run commands on
      # the Mac at its next shell. post-create.sh links them into $HOME.
      - ${HOME}/src/dotfiles:/run/host-dotfiles:ro

volumes:
  repos:
  claude:
  go:
  waldo_home:
